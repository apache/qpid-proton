# Azure Pipeline build definition
#
# Use RelWithDebInfo build configuration so that linking on Windows doesn't require the
# usually absent python debug dll.
#
variables:
  Config: 'RelWithDebInfo'
  PythonVersion: '3.12'
  PythonArch: 'x64'
  CmakeConfigExtraArgs: ''
  CmakeGenerator: '-G Ninja'
  StaticLibs: yes

jobs:
- job: Windows
  variables:
    CmakeConfigExtraArgs: '-A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake'
    CmakeGenerator: '-G "Visual Studio 18 2026"'
    VCPKG_DEFAULT_TRIPLET: x64-windows
  pool:
    vmImage: 'windows-latest'
  steps:
  - script: |
      vcpkg install jsoncpp
      vcpkg integrate install
    name: InstallExtraStuff
  - template: steps.yml
- job: Ubuntu
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - script: |
      sudo apt-get update
      sudo apt-get install -y swig sasl2-bin libpython3-dev libsasl2-dev libjsoncpp-dev libc-ares-dev
    name: InstallExtraStuff
  - template: steps.yml
- job: MacOS
  variables:
    CmakeConfigExtraArgs: '-DBUILD_RUBY=no'
  pool:
    vmImage: 'macOS-latest'
  steps:
  - script: |
      brew install libuv pkgconfig jsoncpp openssl@3.6
      OPENSSL_PREFIX=$(brew --prefix openssl@3.6)
      echo "##vso[task.setvariable variable=OPENSSL_ROOT_DIR]$OPENSSL_PREFIX"
      echo "##vso[task.setvariable variable=PKG_CONFIG_PATH]$OPENSSL_PREFIX/lib/pkgconfig"
    name: InstallExtraStuff
  - template: steps.yml
